[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "company-bid"
version = "0.1.0"
description = "Independent M1 company bid document prototype"
requires-python = ">=3.12"
dependencies = [
  "pydantic==2.14.2",
  "python-docx==1.2.0",
  "Pillow==13.0.0",
  "pypdf==6.21.4",
  "pdf2image==1.17.0",
  "pdfplumber==0.11.9",
  "pypdfium2==5.14.0",
  "opentelemetry-sdk==1.45.2",
]

[project.optional-dependencies]
test = ["pytest==9.2.0"]

[project.scripts]
company-bid = "company_bid.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
